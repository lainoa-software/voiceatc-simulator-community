name: Daily Community Release

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialises every workflow that writes to main. This job deletes and recreates
# the rolling `latest` release and pushes a manifest commit, so two overlapping
# runs corrupt each other. Shared with format-all-json.yml, which also pushes.
#
# cancel-in-progress stays false: a run must never be killed between deleting
# `latest` and recreating it. Queued runs coalesce instead — GitHub keeps only
# the newest pending run per group, and that run sees every commit accumulated
# while the current one was busy.
concurrency:
  group: community-repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Deliberately the default token checkout, not `ssh-key:`. Everything that
      # reaches players — R2, release assets, manifests — runs before the commit
      # step, so a checkout that cannot authenticate would take the whole
      # release down to fix its last step. The deploy key is armed in that step
      # alone, where a bad key costs only the commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate content hierarchy
        run: python tools/content_hierarchy.py --validate-only
      - name: Validate routes file
        run: python tools/routes_release_manifest.py --validate-only
      - name: Validate default routes file
        run: python tools/routes_release_manifest.py --validate-only --validate-default
      - name: Validate MVA files
        run: python tools/mva_manifest.py --validate-only
      - name: Validate runway config files
        run: python tools/runway_configs_manifest.py --validate-only
      - name: Validate sector data files
        run: python tools/sector_data_manifest.py --validate-only
      - name: Validate misc drawings files
        run: python tools/misc_drawings_manifest.py --validate-only
      - name: Validate color profile files
        run: python tools/color_profiles_manifest.py --validate-only
      - name: Validate constraints files
        run: python tools/constraints_manifest.py --validate-only
      - name: Validate procedure options files
        run: python tools/procedure_options_manifest.py --validate-only
      - name: Validate player route files
        run: python tools/player_routes_manifest.py --validate-only
      - name: Compute route lane cycles
        id: lanes
        shell: bash
        run: |
          set -euo pipefail
          header_airac() { head -n 1 "$1" | sed -nE 's/^airac[[:space:]]+([0-9]{4}).*/\1/Ip'; }
          echo "current_airac=$(header_airac ROUTES/routes.tsv)" >> "$GITHUB_OUTPUT"
          echo "default_airac=$(header_airac ROUTES/routes_default.tsv)" >> "$GITHUB_OUTPUT"
      - name: Cache route graph databases
        uses: actions/cache@v4
        with:
          path: build/navdb
          key: player-navdb-${{ steps.lanes.outputs.current_airac }}-${{ steps.lanes.outputs.default_airac }}
      - name: Fetch route graph databases
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CUR_AIRAC: ${{ steps.lanes.outputs.current_airac }}
          DEF_AIRAC: ${{ steps.lanes.outputs.default_airac }}
        run: |
          # Deep-validation inputs for player-contributed routes: the compacted
          # route graph (~12 MB) and navdata (~165 MB) per lane, produced by the
          # game repo's AIRAC pipeline. The cache step above keys them by cycle
          # pair, so R2 sees real downloads roughly once per cycle, not daily.
          # Best-effort throughout: when a database is missing the release still
          # ships and player route statuses carry forward unchanged.
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${R2_ACCOUNT_ID:-}" || -z "${R2_BUCKET:-}" ]]; then
            echo "Cloudflare R2 secrets not configured — skipping graph fetch."
            exit 0
          fi
          python -m pip install --quiet --upgrade awscli
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fetch() {
            # Download to .tmp then move, so a failed transfer can never leave a
            # partial file that would poison the cycle-keyed cache.
            local key="$1" dest="$2"
            if [[ -f "${dest}" ]]; then
              echo "cached: ${dest}"
              return 0
            fi
            if aws s3 cp "s3://${R2_BUCKET}/${key}" "${dest}.tmp" --endpoint-url "${EP}"; then
              mv "${dest}.tmp" "${dest}"
            else
              rm -f "${dest}.tmp"
              echo "unavailable: ${key}"
            fi
          }
          if [[ -n "${CUR_AIRAC}" ]]; then
            mkdir -p build/navdb/current
            fetch "graphs/${CUR_AIRAC}/compacted_route_graph_${CUR_AIRAC}.s3db" "build/navdb/current/graph.s3db"
            fetch "navdata/${CUR_AIRAC}/navigraph_data.s3db" "build/navdb/current/navdata.s3db"
          fi
          if [[ -n "${DEF_AIRAC}" ]]; then
            mkdir -p build/navdb/default
            fetch "graphs/${DEF_AIRAC}/compacted_route_graph_${DEF_AIRAC}_default.s3db" "build/navdb/default/graph.s3db"
            fetch "navdata/${DEF_AIRAC}/navigraph_data_default.s3db" "build/navdb/default/navdata.s3db"
          fi
      - name: Compute release metadata
        id: meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DATE="$(date -u +%F)"
          BASE_TAG="daily-${RELEASE_DATE}"
          WEEKDAY="$(date -u +%A)"
          BASE_TITLE="Daily Community Release - ${WEEKDAY} ${RELEASE_DATE}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p build/release
          export BASE_TAG BASE_TITLE
          mapfile -t RELEASE_IDENTITY < <(python - <<'PY'
          import json
          import os
          import subprocess

          def suffix_for(index: int) -> str:
              letters = "abcdefghijklmnopqrstuvwxyz"
              value = index + 1
              suffix = ""
              while value > 0:
                  value, remainder = divmod(value - 1, 26)
                  suffix = letters[remainder] + suffix
              return suffix

          base_tag = os.environ["BASE_TAG"].strip()
          base_title = os.environ["BASE_TITLE"].strip()
          is_manual = os.environ.get("GITHUB_EVENT_NAME", "").strip() == "workflow_dispatch"
          tag = base_tag
          title = base_title

          if is_manual:
              releases = json.loads(
                  subprocess.check_output(
                      ["gh", "release", "list", "--limit", "200", "--json", "tagName,name"],
                      text=True,
                  )
              )
              existing_tags = {str(item.get("tagName", "")).strip() for item in releases}
              existing_titles = {str(item.get("name", "")).strip() for item in releases}
              if tag in existing_tags or title in existing_titles:
                  candidate_index = 1
                  while True:
                      suffix = suffix_for(candidate_index)
                      candidate_tag = f"{base_tag}-{suffix}"
                      candidate_title = f"{base_title} {suffix}"
                      if candidate_tag not in existing_tags and candidate_title not in existing_titles:
                          tag = candidate_tag
                          title = candidate_title
                          break
                      candidate_index += 1

          print(tag)
          print(title)
          print("true" if is_manual else "false")
          PY
          )
          TAG="${RELEASE_IDENTITY[0]}"
          TITLE="${RELEASE_IDENTITY[1]}"
          IS_MANUAL="${RELEASE_IDENTITY[2]}"
          export IS_MANUAL
          python tools/community_release_manifest.py \
            --output-dir build/release \
            --release-tag "${TAG}" \
            --release-title "${TITLE}" \
            --published-at "${PUBLISHED_AT}" \
            --commit-sha "${SOURCE_SHA}" \
            --download-repo "${GITHUB_REPOSITORY}" > build/release/summary.json
          python tools/player_routes_manifest.py --build \
            --output-dir build/release \
            --release-tag "${TAG}" \
            --published-at "${PUBLISHED_AT}" \
            --commit-sha "${SOURCE_SHA}" \
            --download-repo "${GITHUB_REPOSITORY}" \
            --current-graph build/navdb/current/graph.s3db \
            --current-navdata build/navdb/current/navdata.s3db \
            --default-graph build/navdb/default/graph.s3db \
            --default-navdata build/navdb/default/navdata.s3db > build/release/player_summary.json
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("build/release/summary.json").read_text(encoding="utf-8"))
          assets = summary["assets"]
          player_summary = json.loads(Path("build/release/player_summary.json").read_text(encoding="utf-8"))
          player_assets = player_summary["assets"]

          def previous_hash(path: str) -> str:
              manifest_path = Path(path)
              if not manifest_path.exists():
                  return ""
              try:
                  payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception:
                  return ""
              return str(payload.get("sha256", "")).strip()

          def previous_rich_routes_hash(path: str) -> str:
              manifest_path = Path(path)
              if not manifest_path.exists():
                  return ""
              try:
                  payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception:
                  return ""
              rich = payload.get("rich_routes_tsv", {})
              return str(rich.get("sha256", "")).strip() if isinstance(rich, dict) else ""

          def previous_player_overlay_hash(tier: str) -> str:
              manifest_path = Path(".voiceatc/player_routes_manifest.json")
              if not manifest_path.exists():
                  return ""
              try:
                  payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception:
                  return ""
              tier_payload = payload.get(tier, {})
              return str(tier_payload.get("sha256", "")).strip() if isinstance(tier_payload, dict) else ""

          release_assets_changed = not (
              previous_hash(".voiceatc/routes_manifest.json") == str(assets["routes_tsv"]["sha256"]).strip()
              and previous_rich_routes_hash(".voiceatc/routes_manifest.json") == str(assets["routes_rich_tsv"]["sha256"]).strip()
              and previous_hash(".voiceatc/mva_manifest.json") == str(assets["mva_zip"]["sha256"]).strip()
              and previous_hash(".voiceatc/runway_configs_manifest.json") == str(assets["runway_configs_zip"]["sha256"]).strip()
              and previous_hash(".voiceatc/sector_data_manifest.json") == str(assets["sector_data_zip"]["sha256"]).strip()
              and previous_hash(".voiceatc/misc_drawings_manifest.json") == str(assets["misc_drawings_zip"]["sha256"]).strip()
              and previous_hash(".voiceatc/color_profiles_manifest.json") == str(assets["color_profiles_zip"]["sha256"]).strip()
              and previous_player_overlay_hash("current") == str(player_assets["player_routes_tsv"]["sha256"]).strip()
              and previous_player_overlay_hash("default") == str(player_assets["player_routes_default_tsv"]["sha256"]).strip()
          )

          constraints_spec = importlib.util.spec_from_file_location(
              "constraints_manifest", Path("tools/constraints_manifest.py")
          )
          if constraints_spec is None or constraints_spec.loader is None:
              raise RuntimeError("unable to load tools/constraints_manifest.py")
          constraints_module = importlib.util.module_from_spec(constraints_spec)
          constraints_spec.loader.exec_module(constraints_module)
          generated_constraints_manifest = constraints_module.build_manifest(Path("."))
          constraints_manifest_path = Path(".voiceatc/constraints_manifest.json")

          current_constraints_manifest: object = {}
          if constraints_manifest_path.exists():
              try:
                  current_constraints_manifest = json.loads(
                      constraints_manifest_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  current_constraints_manifest = {}

          def canonical_hash(payload: object) -> str:
              encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          constraints_changed = canonical_hash(current_constraints_manifest) != canonical_hash(generated_constraints_manifest)

          options_spec = importlib.util.spec_from_file_location(
              "procedure_options_manifest", Path("tools/procedure_options_manifest.py")
          )
          if options_spec is None or options_spec.loader is None:
              raise RuntimeError("unable to load tools/procedure_options_manifest.py")
          options_module = importlib.util.module_from_spec(options_spec)
          options_spec.loader.exec_module(options_module)
          generated_options_manifest = options_module.build_manifest(Path("."))
          options_manifest_path = Path(".voiceatc/procedure_options_manifest.json")

          current_options_manifest: object = {}
          if options_manifest_path.exists():
              try:
                  current_options_manifest = json.loads(
                      options_manifest_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  current_options_manifest = {}

          procedure_options_changed = canonical_hash(current_options_manifest) != canonical_hash(generated_options_manifest)

          # Player route status drift (deprecation flips, revalidation stamps) must
          # commit even when the overlay bytes are unchanged — the website badges
          # read the committed status file. The player manifest itself embeds the
          # daily release tag, so it is deliberately NOT part of this comparison.
          player_status_path = Path(".voiceatc/player_routes_status.json")
          current_player_status: object = {}
          if player_status_path.exists():
              try:
                  current_player_status = json.loads(player_status_path.read_text(encoding="utf-8"))
              except Exception:
                  current_player_status = {}
          generated_player_status = dict(player_summary["manifests"]["player_routes_status"])
          stable_current_status = dict(current_player_status) if isinstance(current_player_status, dict) else {}
          generated_player_status.pop("generated_at", None)
          stable_current_status.pop("generated_at", None)
          player_status_changed = canonical_hash(stable_current_status) != canonical_hash(generated_player_status)

          changed = release_assets_changed or constraints_changed or procedure_options_changed or player_status_changed
          should_publish = release_assets_changed or os.environ.get("IS_MANUAL", "").strip() == "true"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if changed else 'false'}\n")
              handle.write(f"release_assets_changed={'true' if release_assets_changed else 'false'}\n")
              handle.write(f"constraints_changed={'true' if constraints_changed else 'false'}\n")
              handle.write(f"procedure_options_changed={'true' if procedure_options_changed else 'false'}\n")
              handle.write(f"player_status_changed={'true' if player_status_changed else 'false'}\n")
              handle.write(f"should_publish={'true' if should_publish else 'false'}\n")
              handle.write(f"airac={summary['airac']}\n")
              handle.write(f"routes_asset_name={assets['routes_tsv']['asset_name']}\n")
              handle.write(f"routes_rich_asset_name={assets['routes_rich_tsv']['asset_name']}\n")
              handle.write(f"mva_asset_name={assets['mva_zip']['asset_name']}\n")
              handle.write(f"runway_asset_name={assets['runway_configs_zip']['asset_name']}\n")
              handle.write(f"sector_data_asset_name={assets['sector_data_zip']['asset_name']}\n")
              handle.write(f"misc_drawings_asset_name={assets['misc_drawings_zip']['asset_name']}\n")
              handle.write(f"color_profiles_asset_name={assets['color_profiles_zip']['asset_name']}\n")
              handle.write(f"release_manifest_asset_name={assets['release_manifest']['asset_name']}\n")
              handle.write(f"player_routes_asset_name={player_assets['player_routes_tsv']['asset_name']}\n")
              handle.write(f"player_routes_default_asset_name={player_assets['player_routes_default_tsv']['asset_name']}\n")
              handle.write(f"routes_asset_path={assets['routes_tsv']['path']}\n")
              handle.write(f"routes_rich_asset_path={assets['routes_rich_tsv']['path']}\n")
              handle.write(f"mva_asset_path={assets['mva_zip']['path']}\n")
              handle.write(f"runway_asset_path={assets['runway_configs_zip']['path']}\n")
              handle.write(f"sector_data_asset_path={assets['sector_data_zip']['path']}\n")
              handle.write(f"misc_drawings_asset_path={assets['misc_drawings_zip']['path']}\n")
              handle.write(f"color_profiles_asset_path={assets['color_profiles_zip']['path']}\n")
              handle.write(f"release_manifest_asset_path={assets['release_manifest']['path']}\n")
              handle.write(f"player_routes_asset_path={player_assets['player_routes_tsv']['path']}\n")
              handle.write(f"player_routes_default_asset_path={player_assets['player_routes_default_tsv']['path']}\n")
          PY
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          echo "latest_title=Latest Daily Community Release" >> "$GITHUB_OUTPUT"
      - name: Stop when nothing changed
        if: steps.meta.outputs.should_publish != 'true'
        run: echo "No release-managed community artifacts changed."
      - name: Create or update daily release
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          TARGET="${{ steps.meta.outputs.source_sha }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}"
            gh release upload "${TAG}" \
              "${{ steps.meta.outputs.routes_asset_path }}#${{ steps.meta.outputs.routes_asset_name }}" \
              "${{ steps.meta.outputs.routes_rich_asset_path }}#${{ steps.meta.outputs.routes_rich_asset_name }}" \
              "${{ steps.meta.outputs.mva_asset_path }}#${{ steps.meta.outputs.mva_asset_name }}" \
              "${{ steps.meta.outputs.runway_asset_path }}#${{ steps.meta.outputs.runway_asset_name }}" \
              "${{ steps.meta.outputs.sector_data_asset_path }}#${{ steps.meta.outputs.sector_data_asset_name }}" \
              "${{ steps.meta.outputs.misc_drawings_asset_path }}#${{ steps.meta.outputs.misc_drawings_asset_name }}" \
              "${{ steps.meta.outputs.color_profiles_asset_path }}#${{ steps.meta.outputs.color_profiles_asset_name }}" \
              "${{ steps.meta.outputs.player_routes_asset_path }}#${{ steps.meta.outputs.player_routes_asset_name }}" \
              "${{ steps.meta.outputs.player_routes_default_asset_path }}#${{ steps.meta.outputs.player_routes_default_asset_name }}" \
              "${{ steps.meta.outputs.release_manifest_asset_path }}#${{ steps.meta.outputs.release_manifest_asset_name }}" \
              --clobber
          else
            gh release create "${TAG}" \
              "${{ steps.meta.outputs.routes_asset_path }}#${{ steps.meta.outputs.routes_asset_name }}" \
              "${{ steps.meta.outputs.routes_rich_asset_path }}#${{ steps.meta.outputs.routes_rich_asset_name }}" \
              "${{ steps.meta.outputs.mva_asset_path }}#${{ steps.meta.outputs.mva_asset_name }}" \
              "${{ steps.meta.outputs.runway_asset_path }}#${{ steps.meta.outputs.runway_asset_name }}" \
              "${{ steps.meta.outputs.sector_data_asset_path }}#${{ steps.meta.outputs.sector_data_asset_name }}" \
              "${{ steps.meta.outputs.misc_drawings_asset_path }}#${{ steps.meta.outputs.misc_drawings_asset_name }}" \
              "${{ steps.meta.outputs.color_profiles_asset_path }}#${{ steps.meta.outputs.color_profiles_asset_name }}" \
              "${{ steps.meta.outputs.player_routes_asset_path }}#${{ steps.meta.outputs.player_routes_asset_name }}" \
              "${{ steps.meta.outputs.player_routes_default_asset_path }}#${{ steps.meta.outputs.player_routes_default_asset_name }}" \
              "${{ steps.meta.outputs.release_manifest_asset_path }}#${{ steps.meta.outputs.release_manifest_asset_name }}" \
              --target "${TARGET}" \
              --latest=false \
              --title "${TITLE}" \
              --notes "Automated daily community release."
          fi
      - name: Create or update latest release alias
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.latest_tag }}"
          TITLE="${{ steps.meta.outputs.latest_title }}"
          TARGET="${{ steps.meta.outputs.source_sha }}"
          SOURCE_TAG="${{ steps.meta.outputs.tag }}"
          SOURCE_TITLE="${{ steps.meta.outputs.title }}"
          PUBLISHED_AT="${{ steps.meta.outputs.published_at }}"
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<EOF
          Rolling alias for the most recent Daily Community Release.

          Source release: ${SOURCE_TITLE}
          Source tag: ${SOURCE_TAG}
          Published at: ${PUBLISHED_AT}
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
          gh release create "${TAG}" \
            "${{ steps.meta.outputs.routes_asset_path }}#${{ steps.meta.outputs.routes_asset_name }}" \
            "${{ steps.meta.outputs.routes_rich_asset_path }}#${{ steps.meta.outputs.routes_rich_asset_name }}" \
            "${{ steps.meta.outputs.mva_asset_path }}#${{ steps.meta.outputs.mva_asset_name }}" \
            "${{ steps.meta.outputs.runway_asset_path }}#${{ steps.meta.outputs.runway_asset_name }}" \
            "${{ steps.meta.outputs.sector_data_asset_path }}#${{ steps.meta.outputs.sector_data_asset_name }}" \
            "${{ steps.meta.outputs.misc_drawings_asset_path }}#${{ steps.meta.outputs.misc_drawings_asset_name }}" \
            "${{ steps.meta.outputs.color_profiles_asset_path }}#${{ steps.meta.outputs.color_profiles_asset_name }}" \
            "${{ steps.meta.outputs.player_routes_asset_path }}#${{ steps.meta.outputs.player_routes_asset_name }}" \
            "${{ steps.meta.outputs.player_routes_default_asset_path }}#${{ steps.meta.outputs.player_routes_default_asset_name }}" \
            "${{ steps.meta.outputs.release_manifest_asset_path }}#${{ steps.meta.outputs.release_manifest_asset_name }}" \
            --target "${TARGET}" \
            --title "${TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --latest
      - name: Write manifests
        if: steps.meta.outputs.changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("build/release/summary.json").read_text(encoding="utf-8"))
          manifest_paths = {
              "routes": Path(".voiceatc/routes_manifest.json"),
              "mva": Path(".voiceatc/mva_manifest.json"),
              "runway_configs": Path(".voiceatc/runway_configs_manifest.json"),
              "sector_data": Path(".voiceatc/sector_data_manifest.json"),
              "misc_drawings": Path(".voiceatc/misc_drawings_manifest.json"),
              "color_profiles": Path(".voiceatc/color_profiles_manifest.json"),
              "release": Path(".voiceatc/release_manifest.json"),
          }

          for key, path in manifest_paths.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              payload = summary["manifests"][key]
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python tools/constraints_manifest.py --write
          python tools/procedure_options_manifest.py --write
          python tools/player_routes_manifest.py --write-manifests --summary build/release/player_summary.json
      - name: Publish routes to Cloudflare R2
        if: steps.meta.outputs.should_publish == 'true'
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          SUB_AIRAC: ${{ steps.meta.outputs.airac }}
          SUB_TSV: ${{ steps.meta.outputs.routes_asset_path }}
          SUB_RICH_TSV: ${{ steps.meta.outputs.routes_rich_asset_path }}
          PLAYER_TSV: ${{ steps.meta.outputs.player_routes_asset_path }}
          PLAYER_DEF_TSV: ${{ steps.meta.outputs.player_routes_default_asset_path }}
        run: |
          # Mirror the just-published routes to Cloudflare R2 so the game can fetch route data
          # from the api.voiceatcsimulator.com Worker (routes/<airac>/...) instead of GitHub
          # raw/Releases. This is the single canonical R2 publisher. The canonical manifests are
          # uploaded byte-identical; the Worker rewrites their download_url to itself at serve
          # time. Guarded on the R2 secrets being present and continue-on-error, so it is a safe
          # no-op until the secrets are configured and can never fail the release.
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${R2_ACCOUNT_ID:-}" || -z "${R2_BUCKET:-}" ]]; then
            echo "Cloudflare R2 secrets not configured — skipping R2 publish."
            exit 0
          fi
          python -m pip install --quiet --upgrade awscli
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          header_airac() { head -n 1 "$1" | sed -nE 's/^airac[[:space:]]+([0-9]{4}).*/\1/Ip'; }

          # Subscriber cycle: TSV as routes/<airac>/routes.tsv, canonical manifest alongside.
          if [[ -n "${SUB_TSV:-}" && -f "${SUB_TSV}" && -f ".voiceatc/routes_manifest.json" && -n "${SUB_AIRAC:-}" ]]; then
            aws s3 cp "${SUB_TSV}" "s3://${R2_BUCKET}/routes/${SUB_AIRAC}/routes.tsv" \
              --content-type "text/tab-separated-values" --endpoint-url "${EP}"
            if [[ -n "${SUB_RICH_TSV:-}" && -f "${SUB_RICH_TSV}" ]]; then
              aws s3 cp "${SUB_RICH_TSV}" "s3://${R2_BUCKET}/routes/${SUB_AIRAC}/routes_rich.tsv" \
                --content-type "text/tab-separated-values" --endpoint-url "${EP}"
            fi
            aws s3 cp ".voiceatc/routes_manifest.json" "s3://${R2_BUCKET}/routes/${SUB_AIRAC}/routes_manifest.json" \
              --content-type "application/json" --endpoint-url "${EP}"
            echo "Published subscriber routes to routes/${SUB_AIRAC}/."
          else
            echo "Subscriber routes asset or manifest missing — skipping subscriber R2 upload."
          fi

          # Offline/default cycle: routes_default.tsv + its manifest, AIRAC read from the file.
          if [[ -f "ROUTES/routes_default.tsv" && -f "ROUTES/routes_default_manifest.json" ]]; then
            DEF_AIRAC="$(header_airac ROUTES/routes_default.tsv)"
            if [[ -n "${DEF_AIRAC}" ]]; then
              aws s3 cp "ROUTES/routes_default.tsv" "s3://${R2_BUCKET}/routes/${DEF_AIRAC}/routes_default.tsv" \
                --content-type "text/tab-separated-values" --endpoint-url "${EP}"
              if [[ -f "ROUTES/routes_default_rich.tsv" ]]; then
                aws s3 cp "ROUTES/routes_default_rich.tsv" "s3://${R2_BUCKET}/routes/${DEF_AIRAC}/routes_default_rich.tsv" \
                  --content-type "text/tab-separated-values" --endpoint-url "${EP}"
              fi
              aws s3 cp "ROUTES/routes_default_manifest.json" "s3://${R2_BUCKET}/routes/${DEF_AIRAC}/routes_manifest.json" \
                --content-type "application/json" --endpoint-url "${EP}"
              echo "Published default routes to routes/${DEF_AIRAC}/."
            else
              echo "Could not read default routes AIRAC header — skipping default R2 upload."
            fi
          else
            echo "Default routes file or manifest missing — skipping default R2 upload."
          fi

          # Player-contributed route overlays: per-lane TSV plus the shared
          # manifest/status files, published under each lane's cycle prefix so the
          # game and website fetch them next to the managed routes.
          PDEF_AIRAC=""
          if [[ -f "ROUTES/routes_default.tsv" ]]; then
            PDEF_AIRAC="$(header_airac ROUTES/routes_default.tsv)"
          fi
          if [[ -n "${SUB_AIRAC:-}" && -n "${PLAYER_TSV:-}" && -f "${PLAYER_TSV}" ]]; then
            aws s3 cp "${PLAYER_TSV}" "s3://${R2_BUCKET}/routes/${SUB_AIRAC}/player_overlay.tsv" \
              --content-type "text/tab-separated-values" --endpoint-url "${EP}"
            echo "Published player overlay to routes/${SUB_AIRAC}/."
          fi
          if [[ -n "${PDEF_AIRAC}" && -n "${PLAYER_DEF_TSV:-}" && -f "${PLAYER_DEF_TSV}" ]]; then
            aws s3 cp "${PLAYER_DEF_TSV}" "s3://${R2_BUCKET}/routes/${PDEF_AIRAC}/player_overlay.tsv" \
              --content-type "text/tab-separated-values" --endpoint-url "${EP}"
            echo "Published default player overlay to routes/${PDEF_AIRAC}/."
          fi
          for PLAYER_JSON in player_routes_manifest.json player_routes_status.json; do
            if [[ -f ".voiceatc/${PLAYER_JSON}" ]]; then
              for CYCLE in "${SUB_AIRAC:-}" "${PDEF_AIRAC}"; do
                [[ -n "${CYCLE}" ]] || continue
                aws s3 cp ".voiceatc/${PLAYER_JSON}" "s3://${R2_BUCKET}/routes/${CYCLE}/${PLAYER_JSON}" \
                  --content-type "application/json" --endpoint-url "${EP}"
              done
            fi
          done

          # Origin-prefix shards of the managed routes: the website reads
          # routes/<cycle>/od_lookup/<XX>.tsv to show the generated route for one
          # OD pair without ever parsing the full multi-megabyte TSV.
          SUB_TSV_PATH="${SUB_TSV:-}" DEF_TSV_PATH="ROUTES/routes_default.tsv" python - <<'PY'
          import os
          from pathlib import Path

          def build_shards(tsv: str, out_dir: Path) -> None:
              path = Path(tsv)
              if not tsv or not path.is_file():
                  return
              if out_dir.exists():
                  for stale in out_dir.glob("*.tsv"):
                      stale.unlink()
              out_dir.mkdir(parents=True, exist_ok=True)
              shards: dict[str, list[str]] = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  parts = line.split("\t")
                  if len(parts) < 3 or parts[0] == "ORIGIN" or len(parts[0]) != 4 or not parts[0].isalnum():
                      continue
                  shards.setdefault(parts[0][:2].upper(), []).append(line)
              for prefix, rows in sorted(shards.items()):
                  (out_dir / (prefix + ".tsv")).write_text("\n".join(rows) + "\n", encoding="utf-8")
              print(f"{len(shards)} od_lookup shards from {path.name}")

          build_shards(os.environ.get("SUB_TSV_PATH", ""), Path("build/release/od_lookup/current"))
          build_shards(os.environ.get("DEF_TSV_PATH", ""), Path("build/release/od_lookup/default"))
          PY
          if [[ -n "${SUB_AIRAC:-}" && -d build/release/od_lookup/current ]]; then
            aws s3 sync build/release/od_lookup/current "s3://${R2_BUCKET}/routes/${SUB_AIRAC}/od_lookup" \
              --content-type "text/tab-separated-values" --delete --endpoint-url "${EP}"
          fi
          if [[ -n "${PDEF_AIRAC}" && -d build/release/od_lookup/default ]]; then
            aws s3 sync build/release/od_lookup/default "s3://${R2_BUCKET}/routes/${PDEF_AIRAC}/od_lookup" \
              --content-type "text/tab-separated-values" --delete --endpoint-url "${EP}"
          fi

      - name: Commit manifests
        if: steps.meta.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          MANIFESTS=(
            .voiceatc/routes_manifest.json
            .voiceatc/mva_manifest.json
            .voiceatc/runway_configs_manifest.json
            .voiceatc/sector_data_manifest.json
            .voiceatc/misc_drawings_manifest.json
            .voiceatc/color_profiles_manifest.json
            .voiceatc/constraints_manifest.json
            .voiceatc/procedure_options_manifest.json
            .voiceatc/release_manifest.json
            .voiceatc/player_routes_manifest.json
            .voiceatc/player_routes_status.json
          )
          if git diff --quiet -- "${MANIFESTS[@]}" && [[ -z "$(git status --porcelain -- .voiceatc/player_routes_manifest.json .voiceatc/player_routes_status.json)" ]]; then
            exit 0
          fi
          # The main ruleset requires a pull request and GITHUB_TOKEN is not a
          # bypass actor — on a user-owned repository the GitHub Actions
          # integration cannot be named in the allow list at all. A deploy key
          # can, and is listed, so this push travels over SSH as that key.
          # Armed here rather than at checkout so a bad key costs one step.
          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          (umask 077; printf '%s\n' "${RELEASE_DEPLOY_KEY:-}" | tr -d '\r' >"${KEY_FILE}")
          # Store this secret as the whole private key file, BEGIN and END lines
          # included. The CRLF strip and the added final newline cover a key
          # pasted from a Windows editor; nothing can recover one pasted without
          # its header, and OpenSSH reports every one of these the same way —
          # "error in libcrypto", which names neither the secret nor the cause.
          # Hence the explicit parse check and the message below.
          if ! ssh-keygen -y -f "${KEY_FILE}" >/dev/null 2>&1; then
            rm -f "${KEY_FILE}"
            echo "::error::RELEASE_DEPLOY_KEY is absent, encrypted, or not a whole private key file (needs the -----BEGIN/END----- lines). Everything published; only the manifest commit was skipped."
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${MANIFESTS[@]}"
          git commit -m "chore: refresh daily community release manifests"
          # Contributions land on main directly, so a push here can race one that
          # arrived while the release was building. Do not rebase to recover:
          # every file above is a generated artifact rewritten whole, so the
          # rebase conflicts on exactly the files it is trying to carry across,
          # and a conflicted rebase leaves a detached HEAD with unmerged files
          # that makes every later attempt fail too — one lost race then costs
          # the whole release. Rebuild the commit on the new tip instead: take
          # origin/main wholesale, lay this run's manifests back on top. They are
          # derived from content, not edited, so this run's copies simply win and
          # no merge is needed. The next run regenerates them regardless.
          MANIFEST_COMMIT="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebuilding the manifest commit onto origin/main"
            # Clear any half-finished rebase left by an older revision of this
            # loop, so a resumed run is never stuck off-branch.
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD
            git checkout "${MANIFEST_COMMIT}" -- "${MANIFESTS[@]}"
            if git diff --cached --quiet -- "${MANIFESTS[@]}"; then
              echo "origin/main already carries these manifests; nothing left to push"
              exit 0
            fi
            git commit -m "chore: refresh daily community release manifests"
            sleep $(( (RANDOM % 5) + attempt ))
          done
          git push

      # A failed release stops every data type shipping — routes, MVAs, sector
      # data and all airports — not just whatever caused it. Without this the
      # only signal is players reporting stale data days later.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          ALERT_WEBHOOK: ${{ secrets.RELEASE_ALERT_WEBHOOK }}
        run: |
          set -uo pipefail
          if [[ -z "${ALERT_WEBHOOK:-}" ]]; then
            echo "RELEASE_ALERT_WEBHOOK not configured — skipping alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE=":rotating_light: **Daily Community Release failed** — no community data is shipping until this is fixed (routes, MVAs, runway configs, sector data, colours)."
          jq -n --arg msg "${MESSAGE}" --arg url "${RUN_URL}" '{content: ($msg + "\n" + $url)}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "${ALERT_WEBHOOK}"
