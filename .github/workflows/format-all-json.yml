name: Format All JSON

on:
  push:
    branches:
      - main
    # .voiceatc/ is CI-owned. A push that touches nothing else is a release
    # commit, and daily-release.yml already wrote it in this workflow's final
    # form. A path filter (not a job `if:`) so such a push creates no run at all:
    # a skipped run would still take the shared concurrency slot and could
    # replace a pending run queued by a contributor merge.
    paths:
      - "**/*.json"
      - "!.voiceatc/**"
  workflow_dispatch:

permissions:
  contents: write

# Shares the write lock with daily-release.yml so a formatting commit cannot
# land in the middle of a release, between the manifest build and its push.
concurrency:
  group: community-repo-write
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run format:json
      # Formatting changes the exact bytes protected by the visual manifest.
      # Refresh it in the same commit so main can never contain formatted data
      # paired with the pre-format hash and size.
      - run: python tools/visual_procedures_manifest.py --write --preserve-published-at
      - run: python tools/visual_procedures_manifest.py --validate-only
      - run: python tools/visual_go_arounds_manifest.py --write --preserve-published-at
      - run: python tools/visual_go_arounds_manifest.py --validate-only
      - run: python tools/visual_sight_references_manifest.py --write --preserve-published-at
      - run: python tools/visual_sight_references_manifest.py --validate-only
      - run: python tools/constraints_manifest.py --write --preserve-published-at
      - run: python tools/constraints_manifest.py --validate-only
      - run: python tools/procedure_options_manifest.py --write --preserve-published-at
      - run: python tools/procedure_options_manifest.py --validate-only
      - run: python tools/map_display_manifest.py --write --preserve-published-at
      - run: python tools/map_display_manifest.py --validate-only
      # The generators above mirror their manifests into .voiceatc/full/ with
      # json.dumps, which expands short arrays that prettier collapses. Format
      # again so the commit holds prettier's bytes; otherwise the step below
      # stages json.dumps output that the pre-commit prettier turns back into
      # HEAD, and the commit is empty. Manifests hash data files, not other
      # manifests, so this pass leaves every recorded hash valid.
      - run: npm run format:json
      - name: Commit formatted JSON
        shell: bash
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          git add -A -- ':(glob)**/*.json'
          # Compare the index, not the working tree: a file that is only
          # rewritten to its committed content is not a change to commit.
          if git diff --cached --quiet; then
            echo "No JSON formatting changes."
            exit 0
          fi
          # Pushes to main as the release deploy key, for the reason spelled out
          # in daily-release.yml § Commit manifests. Armed after the no-op guard
          # so a formatting run with nothing to do never fails on the secret.
          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          (umask 077; printf '%s\n' "${RELEASE_DEPLOY_KEY:-}" | tr -d '\r' >"${KEY_FILE}")
          if ! ssh-keygen -y -f "${KEY_FILE}" >/dev/null 2>&1; then
            rm -f "${KEY_FILE}"
            echo "::error::RELEASE_DEPLOY_KEY is absent, encrypted, or not a whole private key file (needs the -----BEGIN/END----- lines)."
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Everything staged was just formatted by prettier, so the pre-commit
          # hook (lint-staged running the same prettier) has nothing to add.
          HUSKY=0 git commit -m "chore: format JSON"
          # Contributions push to main directly; rebase and retry instead of
          # failing and leaving unformatted JSON on the branch.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase --autostash origin main
            sleep $(( (RANDOM % 5) + attempt ))
          done
          git push
