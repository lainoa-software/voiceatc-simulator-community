name: Validate Community Repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep this job named `validate`. The branch ruleset on main requires a status
  # check with exactly that context, and this is the only pull-request workflow:
  # it runs every release preflight on every pull request, with no paths filter.
  # Per-dataset copies of these steps were removed as pure duplicates.
  # Renaming it without updating the ruleset first blocks every pull request
  # forever, waiting for a check that no longer exists.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate content hierarchy
        run: python tools/content_hierarchy.py --validate-only
      - name: Validate routes file
        run: python tools/routes_release_manifest.py --validate-only
      - name: Validate default routes file
        run: python tools/routes_release_manifest.py --validate-only --validate-default
      - name: Validate MVA files
        run: python tools/mva_manifest.py --validate-only
      - name: Validate runway config files
        run: python tools/runway_configs_manifest.py --validate-only
      - name: Validate sector data files
        run: python tools/sector_data_manifest.py --validate-only
      - name: Validate misc drawings files
        run: python tools/misc_drawings_manifest.py --validate-only
      - name: Validate color profile files
        run: python tools/color_profiles_manifest.py --validate-only
      - name: Validate constraints files
        run: python tools/constraints_manifest.py --validate-sources
      - name: Validate procedure options files
        run: python tools/procedure_options_manifest.py --validate-sources
      - name: Validate map display files
        run: python tools/map_display_manifest.py --validate-sources
      - name: Validate visual procedure files
        run: python tools/visual_procedures_manifest.py --validate-sources
      - name: Validate visual go-around files
        run: python tools/visual_go_arounds_manifest.py --validate-sources
      - name: Validate visual sight-reference files
        run: python tools/visual_sight_references_manifest.py --validate-sources
      - name: Validate player route files
        run: python tools/player_routes_manifest.py --validate-only
      - name: Validate route rule files
        run: python tools/route_rules_check.py --validate-only
      - name: Validate channel gates
        run: python tools/release_gates.py --validate-only
      - name: Validate gated route overlays
        run: python tools/routes_full_feed.py --validate-only
      # Builds the release locally (nothing is published) and replays the stable
      # 0.6.1.24 rules on the default output, so a pull request that adds a new
      # file kind or field without a gate fails here instead of breaking players.
      - name: Guard the stable contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pr-release
          python tools/community_release_manifest.py \
            --output-dir build/pr-release \
            --release-tag daily-2000-01-01 \
            --published-at 2000-01-01T00:00:00Z \
            --commit-sha "${GITHUB_SHA}" > build/pr-release/summary.json
          python tools/stable_contract_guard.py --summary build/pr-release/summary.json
