name: Validate Content Hierarchy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep this job named `validate`. The branch ruleset on main requires a status
  # check with exactly that context, and this is the only validation workflow
  # without a paths filter, so it is the one that reports on every pull request.
  # Renaming it without updating the ruleset first blocks every pull request
  # forever, waiting for a check that no longer exists.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run hierarchy tests
        run: python -m unittest discover -s tests -p "test_content_hierarchy.py"
      - name: Validate content hierarchy
        run: python tools/content_hierarchy.py --validate-only
