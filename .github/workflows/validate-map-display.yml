name: Validate Map Display

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/map_display.json"
      - "tools/map_display_manifest.py"
      - "tests/test_map_display_manifest.py"
      - ".github/workflows/validate-map-display.yml"

jobs:
  map-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate map display files
        run: python tools/map_display_manifest.py --validate-sources
