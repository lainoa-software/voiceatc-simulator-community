name: Validate Player Routes

on:
  pull_request:
    branches:
      - main
    paths:
      - "ROUTES/player/**"
      - "tools/player_routes_manifest.py"
      - "tools/routes_connectivity_check.py"
      - "tests/test_player_routes_manifest.py"
      - ".github/workflows/validate-player-routes.yml"

jobs:
  player-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate player route files
        run: python tools/player_routes_manifest.py --validate-only
